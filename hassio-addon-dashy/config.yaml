name: "Dashy"
version: "4.6.14"
slug: "dashy"
description: "A self-hostable personal dashboard built for you. Includes status-checking, widgets, themes, icon packs, a UI editor and tons more!"
url: "https://github.com/lissy93/dashy"
startup: "services"
boot: "auto"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - type: addon_config
    read_only: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web server port"
